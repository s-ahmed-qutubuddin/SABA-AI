services:
  - type: web
    name: saba-family-assistant
    runtime: python
    plan: free
    buildCommand: "python -m pip install -r requirements-cloud.txt && cd frontend && npm ci && npm run build"
    startCommand: "uvicorn backend.api:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: SABA_ACCESS_CODE
        sync: false
      - key: SABA_SESSION_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TEXT_MODEL
        value: gemini-3-flash-preview
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.1-flash-live-preview
      - key: GEMINI_VOICE
        value: Kore
      - key: CORS_ORIGINS
        value: "*"
      - key: SABA_SECURE_COOKIES
        value: "true"
      - key: HTTP_RATE_LIMIT
        value: "120"
      - key: HTTP_RATE_WINDOW_SECONDS
        value: "60"
